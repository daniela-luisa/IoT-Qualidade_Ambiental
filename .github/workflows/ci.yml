name: CI

on:
  push:
  pull_request:

jobs:
  # ── Job 1: roda a suíte de testes unitários e de integração ──────────────
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: macp
          POSTGRES_PASSWORD: macp_test
          POSTGRES_DB: macp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macp -d macp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://macp:macp_test@localhost:5432/macp_test
      JWT_SECRET: segredo-ficticio-de-teste-com-mais-de-32-caracteres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements-dev.txt

      - name: Rodar testes
        run: pytest tests -v

  # ── Job 2: valida o compose e constrói a imagem do backend ───────────────
  compose:
    name: Docker Compose + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar .env
        run: cp .env.example .env

      - name: Validar compose.yaml
        run: docker compose config -q

      - name: Construir imagem do backend
        run: docker compose build backend
