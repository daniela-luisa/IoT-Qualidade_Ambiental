  #     MQTT_HOST: mosquitto
  #     DB_HOST: postgres
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     mosquitto:
  #       condition: service_started
  #   ports:
  #     - "8000:8000"

volumes:
  mosquitto_data:
  pg_data:
